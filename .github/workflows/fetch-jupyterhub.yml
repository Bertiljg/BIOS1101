name: Fetch new weeks from JupyterHub

on:
  schedule:
    - cron: "0 5 * * *"     # every day at 05:00 UTC (06:00/07:00 in Norway)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets the job commit and push

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests truststore

      # jupyterhub.uio.no doesn't send its intermediate certificate. Browsers and
      # Windows fetch it automatically; Linux doesn't, so download it and trust it here.
      - name: Add the hub's intermediate certificate
        run: |
          url=$(echo | openssl s_client -connect jupyterhub.uio.no:443 -servername jupyterhub.uio.no 2>/dev/null \
                | openssl x509 -noout -ext authorityInfoAccess | grep -oP 'CA Issuers - URI:\K\S+')
          echo "Intermediate certificate: $url"
          curl -fsSL "$url" -o /tmp/inter.crt
          openssl x509 -inform DER -in /tmp/inter.crt -out /tmp/inter.pem 2>/dev/null || cp /tmp/inter.crt /tmp/inter.pem
          sudo cp /tmp/inter.pem /usr/local/share/ca-certificates/uio-intermediate.crt
          sudo update-ca-certificates

      - name: Fetch new week folders
        env:
          JUPYTERHUB_TOKEN: ${{ secrets.JUPYTERHUB_TOKEN }}
        run: python tools/fetch_jupyterhub.py

      - name: Commit and push if anything arrived
        run: |
          git add "JupyterHub Download - BIOS1101"
          if git diff --cached --quiet; then
            echo "No new files."
            exit 0
          fi
          git config user.name "jupyterhub-fetch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Hentet nye uker fra JupyterHub"
          git push